<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeeksforGeeks | ADSA Lab Practicals</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <!-- Prism.js for Code Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #2f8d46;
            --primary-hover: #216d35;
            --bg-dark: #0f1111;
            --bg-card: #1c1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --glass-bg: rgba(28, 30, 30, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Login Overlay --- */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .login-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .login-card input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #2a2c2c;
            color: white;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .login-card button {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-card button:hover {
            background: var(--primary-hover);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* --- Main Content --- */
        #main-container {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        header {
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-note {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .header-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.45rem 0.7rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .header-link:hover {
            color: var(--primary-color);
            background: rgba(47, 141, 70, 0.1);
            border-color: rgba(47, 141, 70, 0.5);
        }

        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            min-height: calc(100vh - 70px);
        }

        /* --- Sidebar --- */
        .sidebar {
            background: #151717;
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 70px);
        }

        .sidebar h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .nav-btn {
            width: 100%;
            text-align: left;
            padding: 0.8rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .nav-btn.active {
            background: rgba(47, 141, 70, 0.15);
            color: var(--primary-color);
            border: 1px solid rgba(47, 141, 70, 0.3);
        }

        /* --- Content Area --- */
        .content-area {
            padding: 2.5rem;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .exp-header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1.5rem;
        }

        .exp-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .exp-aim {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .code-container {
            position: relative;
            background: #1d1f21;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .code-header {
            padding: 0.8rem 1.5rem;
            background: #25282a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-lang {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .copy-btn.copied {
            color: var(--primary-color);
        }

        /* --- Program Tabs (e.g. Experiment 1a / 1b) --- */
        .program-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .program-tab {
            padding: 0.55rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .program-tab:hover {
            color: white;
            border-color: #555;
        }

        .program-tab.active {
            background: rgba(47, 141, 70, 0.15);
            border-color: rgba(47, 141, 70, 0.5);
            color: var(--primary-color);
        }

        pre[class*="language-"] {
            margin: 0 !important;
            padding: 1.5rem !important;
            font-family: 'JetBrains Mono', monospace !important;
            font-size: 0.95rem !important;
            background: #1d1f21 !important;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .header-note {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Login Overlay -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>GeeksforGeeks</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Secure Access Required</p>
            <input type="password" id="passcode" placeholder="Enter Access Code" autofocus onkeydown="if(event.key === 'Enter') checkLogin()">
            <button onclick="checkLogin()">Unlock Practical Box</button>
            <div id="error-msg" class="error-msg">Invalid Access Code. Try again.</div>
        </div>
    </div>

    <!-- Main Application -->
    <div id="main-container">
        <header>
            <div class="logo">
                <i data-lucide="code-2"></i>
                GeeksforGeeks
            </div>
            <div class="header-actions">
                <span class="header-note">Advanced Data Structures &amp; Algorithms Lab</span>
                <a class="header-link" href="sql/">
                    <i data-lucide="database" size="15"></i>
                    SQL Practicals
                </a>
            </div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <h3>Experiments</h3>
                <div id="nav-list"></div>

            <main class="content-area">
                <div id="experiment-content">
                    <div class="exp-header">
                        <h1 class="exp-title" id="display-title">Experiment 1</h1>
                        <p class="exp-aim" id="display-aim">Loading...</p>
                    </div>

                    <div class="program-tabs" id="program-tabs" style="display: none;"></div>

                    <div class="code-container">
                        <div class="code-header">
                            <span class="code-lang" id="display-file">main.c</span>
                            <button class="copy-btn" onclick="copyCode()" id="copy-btn">
                                <i data-lucide="copy" size="16"></i>
                                <span>Copy Code</span>
                            </button>
                        </div>
                        <pre><code class="language-c" id="display-code"></code></pre>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <script>
        // Data populated from the files
                const experiments = [
          {
            "id": 1,
            "title": "Experiment 1",
            "name": "Selection Sort and Insertion Sort",
            "aim": "Write a program to implement the Selection Sort and Insertion Sort algorithms for the given list of integer values.",
            "programs": [
              {
                "label": "1(a) Selection Sort",
                "file": "exp01a_selection_sort.c",
                "code": "#include <stdio.h>\n\nvoid selectionSort(int a[], int n)\n{\n    int i, j, min, temp;\n\n    for (i = 0; i < n - 1; i++)\n    {\n        min = i;\n        for (j = i + 1; j < n; j++)\n        {\n            if (a[j] < a[min])\n                min = j;\n        }\n        if (min != i)\n        {\n            temp = a[i];\n            a[i] = a[min];\n            a[min] = temp;\n        }\n    }\n}\n\nvoid printArray(int a[], int n)\n{\n    int i;\n    for (i = 0; i < n; i++)\n        printf(\"%d \", a[i]);\n    printf(\"\\n\");\n}\n\nint main()\n{\n    int n, i;\n    int a[50];\n\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d integer values: \", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    printf(\"\\nOriginal array            : \");\n    printArray(a, n);\n\n    selectionSort(a, n);\n\n    printf(\"Array after Selection Sort: \");\n    printArray(a, n);\n\n    return 0;\n}\n"
              },
              {
                "label": "1(b) Insertion Sort",
                "file": "exp01b_insertion_sort.c",
                "code": "#include <stdio.h>\n\nvoid insertionSort(int a[], int n)\n{\n    int i, j, key;\n\n    for (i = 1; i < n; i++)\n    {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && a[j] > key)\n        {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n}\n\nvoid printArray(int a[], int n)\n{\n    int i;\n    for (i = 0; i < n; i++)\n        printf(\"%d \", a[i]);\n    printf(\"\\n\");\n}\n\nint main()\n{\n    int n, i;\n    int a[50];\n\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d integer values: \", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    printf(\"\\nOriginal array            : \");\n    printArray(a, n);\n\n    insertionSort(a, n);\n\n    printf(\"Array after Insertion Sort: \");\n    printArray(a, n);\n\n    return 0;\n}\n"
              }
            ]
          },
          {
            "id": 2,
            "title": "Experiment 2",
            "name": "Quicksort",
            "aim": "Write a program to implement the Quicksort algorithm for the given list of integer values.",
            "programs": [
              {
                "label": "Quicksort",
                "file": "exp02_quicksort.c",
                "code": "#include <stdio.h>\n\nvoid swap(int *a, int *b)\n{\n    int t = *a;\n    *a = *b;\n    *b = t;\n}\n\nint partition(int a[], int low, int high)\n{\n    int pivot = a[high];\n    int i = low - 1, j;\n\n    for (j = low; j < high; j++)\n    {\n        if (a[j] <= pivot)\n        {\n            i++;\n            swap(&a[i], &a[j]);\n        }\n    }\n    swap(&a[i + 1], &a[high]);\n    return i + 1;\n}\n\nvoid quickSort(int a[], int low, int high)\n{\n    if (low < high)\n    {\n        int pi = partition(a, low, high);\n        quickSort(a, low, pi - 1);\n        quickSort(a, pi + 1, high);\n    }\n}\n\nvoid printArray(int a[], int n)\n{\n    int i;\n    for (i = 0; i < n; i++)\n        printf(\"%d \", a[i]);\n    printf(\"\\n\");\n}\n\nint main()\n{\n    int n, i;\n    int a[50];\n\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d integer values: \", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    printf(\"\\nOriginal array       : \");\n    printArray(a, n);\n\n    quickSort(a, 0, n - 1);\n\n    printf(\"Array after Quicksort: \");\n    printArray(a, n);\n\n    return 0;\n}\n"
              }
            ]
          },
          {
            "id": 3,
            "title": "Experiment 3",
            "name": "Merge Sort",
            "aim": "Write a program to implement the Merge Sort algorithm for the given list of integer values.",
            "programs": [
              {
                "label": "Merge Sort",
                "file": "exp03_mergesort.c",
                "code": "#include <stdio.h>\n\nvoid merge(int a[], int low, int mid, int high)\n{\n    int temp[50];\n    int i = low, j = mid + 1, k = 0;\n\n    while (i <= mid && j <= high)\n    {\n        if (a[i] <= a[j])\n            temp[k++] = a[i++];\n        else\n            temp[k++] = a[j++];\n    }\n    while (i <= mid)\n        temp[k++] = a[i++];\n    while (j <= high)\n        temp[k++] = a[j++];\n\n    for (i = low, k = 0; i <= high; i++, k++)\n        a[i] = temp[k];\n}\n\nvoid mergeSort(int a[], int low, int high)\n{\n    if (low < high)\n    {\n        int mid = (low + high) / 2;\n        mergeSort(a, low, mid);\n        mergeSort(a, mid + 1, high);\n        merge(a, low, mid, high);\n    }\n}\n\nvoid printArray(int a[], int n)\n{\n    int i;\n    for (i = 0; i < n; i++)\n        printf(\"%d \", a[i]);\n    printf(\"\\n\");\n}\n\nint main()\n{\n    int n, i;\n    int a[50];\n\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d integer values: \", n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    printf(\"\\nOriginal array       : \");\n    printArray(a, n);\n\n    mergeSort(a, 0, n - 1);\n\n    printf(\"Array after Mergesort: \");\n    printArray(a, n);\n\n    return 0;\n}\n"
              }
            ]
          },
          {
            "id": 4,
            "title": "Experiment 4",
            "name": "Binary Search Tree and Traversals",
            "aim": "Construct a Binary Search Tree for the given sequence of integers and perform pre-order, in-order and post-order traversals.",
            "programs": [
              {
                "label": "BST Traversals",
                "file": "exp04_bst.c",
                "code": "#include <stdio.h>\n#include <stdlib.h>\n\nstruct Node\n{\n    int data;\n    struct Node *left, *right;\n};\n\nstruct Node *createNode(int value)\n{\n    struct Node *node = (struct Node *)malloc(sizeof(struct Node));\n    node->data = value;\n    node->left = node->right = NULL;\n    return node;\n}\n\nstruct Node *insert(struct Node *root, int value)\n{\n    if (root == NULL)\n        return createNode(value);\n\n    if (value < root->data)\n        root->left = insert(root->left, value);\n    else if (value > root->data)\n        root->right = insert(root->right, value);\n\n    return root;\n}\n\nvoid preOrder(struct Node *root)\n{\n    if (root != NULL)\n    {\n        printf(\"%d \", root->data);\n        preOrder(root->left);\n        preOrder(root->right);\n    }\n}\n\nvoid inOrder(struct Node *root)\n{\n    if (root != NULL)\n    {\n        inOrder(root->left);\n        printf(\"%d \", root->data);\n        inOrder(root->right);\n    }\n}\n\nvoid postOrder(struct Node *root)\n{\n    if (root != NULL)\n    {\n        postOrder(root->left);\n        postOrder(root->right);\n        printf(\"%d \", root->data);\n    }\n}\n\nint main()\n{\n    int n, i, value;\n    struct Node *root = NULL;\n\n    printf(\"Enter number of nodes: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter %d integers: \", n);\n    for (i = 0; i < n; i++)\n    {\n        scanf(\"%d\", &value);\n        root = insert(root, value);\n    }\n\n    printf(\"\\nPre-order  traversal: \");\n    preOrder(root);\n    printf(\"\\n\");\n\n    printf(\"In-order   traversal: \");\n    inOrder(root);\n    printf(\"\\n\");\n\n    printf(\"Post-order traversal: \");\n    postOrder(root);\n    printf(\"\\n\");\n\n    return 0;\n}\n"
              }
            ]
          },
          {
            "id": 5,
            "title": "Experiment 5",
            "name": "Fractional Knapsack",
            "aim": "Implement a solution for the Fractional Knapsack problem using the greedy technique.",
            "programs": [
              {
                "label": "Fractional Knapsack",
                "file": "exp05_fractional_knapsack.c",
                "code": "#include <stdio.h>\n\nstruct Item\n{\n    int index, weight, value;\n    float ratio;\n};\n\nvoid sortByRatio(struct Item items[], int n)\n{\n    int i, j;\n    struct Item temp;\n\n    for (i = 0; i < n - 1; i++)\n    {\n        for (j = 0; j < n - i - 1; j++)\n        {\n            if (items[j].ratio < items[j + 1].ratio)\n            {\n                temp = items[j];\n                items[j] = items[j + 1];\n                items[j + 1] = temp;\n            }\n        }\n    }\n}\n\nint main()\n{\n    int n, i, capacity;\n    float totalValue = 0.0;\n    struct Item items[20];\n\n    printf(\"Enter number of items: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter weight and value of each item:\\n\");\n    for (i = 0; i < n; i++)\n    {\n        printf(\"Item %d: \", i + 1);\n        scanf(\"%d %d\", &items[i].weight, &items[i].value);\n        items[i].index = i + 1;\n        items[i].ratio = (float)items[i].value / items[i].weight;\n    }\n\n    printf(\"Enter knapsack capacity: \");\n    scanf(\"%d\", &capacity);\n\n    sortByRatio(items, n);\n\n    printf(\"\\nItems selected (decreasing order of value/weight ratio):\\n\");\n    for (i = 0; i < n && capacity > 0; i++)\n    {\n        if (items[i].weight <= capacity)\n        {\n            printf(\"Item %d : 100%%  (weight %d, value %d)\\n\",\n                   items[i].index, items[i].weight, items[i].value);\n            totalValue += items[i].value;\n            capacity -= items[i].weight;\n        }\n        else\n        {\n            float fraction = (float)capacity / items[i].weight;\n            printf(\"Item %d : %.2f%% (weight %d, value %d)\\n\",\n                   items[i].index, fraction * 100,\n                   items[i].weight, items[i].value);\n            totalValue += items[i].value * fraction;\n            capacity = 0;\n        }\n    }\n\n    printf(\"Maximum value in knapsack = %.2f\\n\", totalValue);\n\n    return 0;\n}\n"
              }
            ]
          },
          {
            "id": 6,
            "title": "Experiment 6",
            "name": "Prim's Minimum Spanning Tree",
            "aim": "Implement Prim's algorithm for the Minimum Spanning Tree.",
            "programs": [
              {
                "label": "Prim's Algorithm",
                "file": "exp06_prims.c",
                "code": "#include <stdio.h>\n\n#define V 5\n\nvoid prim(int graph[V][V])\n{\n    int visited[V] = {0};\n    int edges = 0;\n    int cost = 0;\n    int i, j;\n\n    visited[0] = 1;\n\n    printf(\"Edges in MST:\\n\");\n\n    while (edges < V - 1)\n    {\n        int min = 9999;\n        int u = -1, v = -1;\n\n        for (i = 0; i < V; i++)\n        {\n            if (visited[i])\n            {\n                for (j = 0; j < V; j++)\n                {\n                    if (!visited[j] && graph[i][j] != 0)\n                    {\n                        if (graph[i][j] < min)\n                        {\n                            min = graph[i][j];\n                            u = i;\n                            v = j;\n                        }\n                    }\n                }\n            }\n        }\n\n        printf(\"%d - %d : %d\\n\", u, v, min);\n\n        visited[v] = 1;\n        cost = cost + min;\n        edges++;\n    }\n\n    printf(\"Total cost = %d\\n\", cost);\n}\n\nint main()\n{\n    int graph[V][V] =\n    {\n        {0, 1, 2, 0, 0},\n        {1, 0, 5, 4, 2},\n        {2, 5, 0, 6, 0},\n        {0, 4, 6, 0, 9},\n        {0, 2, 0, 9, 0}\n    };\n\n    prim(graph);\n\n    return 0;\n}\n"
              }

                "code": "#include <stdio.h>\n#define MAX 10\n\nint n, target;\nint set[MAX], subset[MAX];\n\nvoid sumOfSubsets(int index, int sum, int start)\n{\n    int i;\n\n    if (sum == target)\n    {\n        printf(\"Subset: \");\n\n        for (i = 0; i < index; i++)\n            printf(\"%d \", subset[i]);\n\n        printf(\"\\n\");\n        return;\n    }\n\n    for (i = start; i < n; i++)\n    {\n        if (sum + set[i] <= target)\n        {\n            subset[index] = set[i];\n\n            sumOfSubsets(index + 1, sum + set[i], i + 1);\n        }\n    }\n}\n\nint main() {\n    int i;\n\n    printf(\"Enter number of elements: \");\n    scanf(\"%d\", &n);\n\n    printf(\"Enter the set elements: \");\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &set[i]);\n    }\n\n    printf(\"Enter the target sum: \");\n    scanf(\"%d\", &target);\n\n    printf(\"\\nSubsets with sum %d are:\\n\", target);\n    sumOfSubsets(0, 0, 0);\n\n    return 0;\n}\n"

            "programs": [
              {
                "label": "N-Queens",
                "file": "exp08_nqueens.c",
                "code": "#include <stdio.h>\n\n#define N 4\n\nint board[N][N];\n\nvoid printBoard() {\n    int i, j;\n    for (i = 0; i < N; i++) {\n        for (j = 0; j < N; j++) {\n            if (board[i][j] == 1)\n                printf(\" Q \");\n            else\n                printf(\" . \");\n        }\n        printf(\"\\n\");\n    }\n    printf(\"\\n\");\n}\n\nint isSafe(int row, int col) {\n    int i, j;\n\n    for (i = 0; i < row; i++)\n        if (board[i][col] == 1)\n            return 0;\n\n    for (i = row - 1, j = col - 1; i >= 0 && j >= 0; i--, j--)\n        if (board[i][j] == 1)\n            return 0;\n\n    for (i = row - 1, j = col + 1; i >= 0 && j < N; i--, j++)\n        if (board[i][j] == 1)\n            return 0;\n\n    return 1;\n}\n\nvoid solve(int row) {\n    int col;\n    if (row == N) {\n        printBoard();\n        return;\n    }\n\n    for (col = 0; col < N; col++) {\n        if (isSafe(row, col)) {\n            board[row][col] = 1;\n            solve(row + 1);\n            board[row][col] = 0;\n        }\n    }\n}\n\nint main() {\n    int i, j;\n\n    for (i = 0; i < N; i++)\n        for (j = 0; j < N; j++)\n            board[i][j] = 0;\n\n    printf(\"Solutions for %d-Queens problem:\\n\\n\", N);\n    solve(0);\n\n    return 0;\n}\n"

            "aim": "Implement the Bellman-Ford algorithm for single-source shortest paths and detect negative weight cycles.",
            "programs": [
              {
                "label": "Bellman-Ford",
                "file": "exp09_bellman_ford.c",
                "code": "#include <stdio.h>\n#include <limits.h>\n\n#define V 7\n#define E 10\n\nstruct Edge {\n    int u, v, w;\n};\n\nvoid BellmanFord(struct Edge edges[], int src) {\n    int dist[V];\n    int i, j;\n\n    for (i = 0; i < V; i++)\n        dist[i] = INT_MAX;\n    dist[src] = 0;\n\n    for (i = 1; i <= V - 1; i++) {\n        for (j = 0; j < E; j++) {\n            int u = edges[j].u;\n            int v = edges[j].v;\n            int w = edges[j].w;\n            if (dist[u] != INT_MAX && dist[u] + w < dist[v]) {\n                dist[v] = dist[u] + w;\n            }\n        }\n    }\n\n    for (j = 0; j < E; j++) {\n        int u = edges[j].u;\n        int v = edges[j].v;\n        int w = edges[j].w;\n        if (dist[u] != INT_MAX && dist[u] + w < dist[v]) {\n            printf(\"Graph contains negative weight cycle!\\n\");\n            return;\n        }\n    }\n\n    printf(\"Vertex Distance from Source %d:\\n\", src);\n    for (i = 0; i < V; i++) {\n        if (dist[i] == INT_MAX)\n            printf(\"%d \\t INF\\n\", i);\n        else\n            printf(\"%d \\t %d\\n\", i, dist[i]);\n    }\n}\n\nint main() {\n    struct Edge edges[E] = {\n        {0, 1, 6}, {0, 2, 5}, {0, 3, 5},\n        {1, 5, -1},\n        {2, 1, -2}, {2, 4, 1},\n        {3, 2, -2}, {3, 5, 1},\n        {4, 6, -1},\n        {5, 6, 3}\n    };\n\n    BellmanFord(edges, 0);\n    return 0;\n}\n"

          {
            "id": 11,
            "title": "Experiment 11",
            "name": "Rabin-Karp Algorithm",
            "aim": "Implement the Rabin-Karp algorithm for pattern matching.",
            "programs": [
              {
                "label": "Rabin-Karp",
                "file": "exp11_rabin_karp.c",
                "code": "#include <stdio.h>\n#include <string.h>\n#include <math.h>\n\n#define d 26\n#define q 101\n\nvoid rabinKarp(char text[], char pattern[]) {\n    int n = strlen(text);\n    int m = strlen(pattern);\n    int i, j;\n    int pHash = 0;\n    int tHash = 0;\n    int h = 1;\n    int found = 0;\n\n    for (i = 0; i < m - 1; i++)\n        h = (h * d) % q;\n\n    for (i = 0; i < m; i++) {\n        pHash = (d * pHash + (pattern[i] - 'a')) % q;\n        tHash = (d * tHash + (text[i] - 'a')) % q;\n    }\n\n    for (i = 0; i <= n - m; i++) {\n        if (pHash == tHash) {\n            for (j = 0; j < m; j++) {\n                if (text[i + j] != pattern[j])\n                    break;\n            }\n            if (j == m) {\n                printf(\"Pattern found at position: %d\\n\", i);\n                found = 1;\n            }\n        }\n\n        if (i < n - m) {\n            tHash = (d * (tHash - (text[i] - 'a') * h) + (text[i + m] - 'a')) % q;\n\n            if (tHash < 0)\n                tHash += q;\n        }\n    }\n\n    if (!found)\n        printf(\"No match found!\\n\");\n}\n\nint main() {\n    char text[100], pattern[100];\n\n    printf(\"Enter the text (lowercase letters only): \");\n    scanf(\" %99[^\\n]\", text);\n\n    printf(\"Enter the pattern (lowercase letters only): \");\n    scanf(\" %99[^\\n]\", pattern);\n\n    rabinKarp(text, pattern);\n\n    return 0;\n}\n"
              }

        let currentExp = null;
        let currentProgramIndex = 0;

        function checkLogin() {
            const input = document.getElementById('passcode').value;
            const error = document.getElementById('error-msg');
            
            if (input.toUpperCase() === 'BEER') {
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('main-container').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('main-container').style.opacity = '1';
                    }, 50);
                    initApp();
                }, 500);
            } else {
                error.style.display = 'block';
                input.value = '';
            }
        }

        function initApp() {
            lucide.createIcons();
            renderNav();
            loadExperiment(1);
        }

        function renderNav() {
            const nav = document.getElementById('nav-list');
            nav.innerHTML = '';
            experiments.forEach(exp => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.id = `nav-${exp.id}`;
                btn.innerHTML = `<i data-lucide="file-code" size="16"></i> ${exp.title}`;
                btn.title = exp.name;
                btn.onclick = () => loadExperiment(exp.id);
                nav.appendChild(btn);
            });
            lucide.createIcons();
        }

        function loadExperiment(id) {
            const exp = experiments.find(e => e.id === id);
            currentExp = exp;

            // Update experiment heading
            document.getElementById('display-title').innerText = `${exp.title}: ${exp.name}`;
            document.getElementById('display-aim').innerText = exp.aim;

            // Build tabs when an experiment has multiple programs (e.g. 1a and 1b)
            renderProgramTabs(exp);
            loadProgram(0);

            // Update sidebar active state
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${id}`).classList.add('active');
        }

        function renderProgramTabs(exp) {
            const tabs = document.getElementById('program-tabs');
            tabs.innerHTML = '';

            if (exp.programs.length > 1) {
                exp.programs.forEach((program, index) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'program-tab' + (index === 0 ? ' active' : '');
                    btn.textContent = program.label;
                    btn.onclick = () => loadProgram(index);
                    tabs.appendChild(btn);
                });
                tabs.style.display = 'flex';
            } else {
                tabs.style.display = 'none';
            }
        }

        function loadProgram(index) {
            currentProgramIndex = index;
            const program = currentExp.programs[index];

            document.getElementById('display-file').innerText = program.file;

            const codeElem = document.getElementById('display-code');
            codeElem.textContent = program.code;
            Prism.highlightElement(codeElem);

            document.querySelectorAll('.program-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });

            // Reset copy button
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerHTML = '<i data-lucide="copy" size="16"></i> <span>Copy Code</span>';
            copyBtn.classList.remove('copied');
            lucide.createIcons();
        }

        function copyCode() {
            const code = currentExp.programs[currentProgramIndex].code;
            navigator.clipboard.writeText(code).then(() => {
                const copyBtn = document.getElementById('copy-btn');
                copyBtn.innerHTML = '<i data-lucide="check" size="16"></i> <span>Copied!</span>';
                copyBtn.classList.add('copied');
                lucide.createIcons();
                
                setTimeout(() => {
                    copyBtn.innerHTML = '<i data-lucide="copy" size="16"></i> <span>Copy Code</span>';
                    copyBtn.classList.remove('copied');
                    lucide.createIcons();
                }, 2000);
            });
        }
    </script>
